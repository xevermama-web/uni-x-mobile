<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A1224" />
    <meta name="mobile-web-app-capable" content="yes" />
    <script>
      (function() {
        try {
          var origFetch = window.fetch ? window.fetch.bind(window) : null;
          var currentFetch = origFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch || origFetch;
            },
            set: function(fn) {
              currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // ignore if window.fetch redefinition fails
        }
      })();
    </script>
    <link rel="icon" href="https://i.postimg.cc/pL83p435/Icon.png" type="image/png" />
    <title>Uni-X</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
